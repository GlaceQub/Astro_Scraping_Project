name: Build, Test & Deploy
defaults:
  run:
    working-directory: Deel2-Astro/frontend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    timeout-minutes: 60
    name: "Build & Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: Deel2-Astro/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm run build
      - name: List files for debug
        run: |
          pwd
          ls -l
          ls -l dist || true
          ls -l playwright-report || true
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Deel2-Astro/frontend/dist
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('Deel2-Astro/frontend/pnpm-lock.yaml') }}
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps
      - name: Install Chromium browser
        run: pnpm exec playwright install chromium
      - name: Install Firefox browser
        run: pnpm exec playwright install firefox
      - name: Install WebKit browser
        run: pnpm exec playwright install webkit
      - name: Run Playwright tests
        run: pnpm exec playwright test --reporter=line,html
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Deel2-Astro/frontend/playwright-report
  deploy:
    name: "Deploy to Combell"
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      - name: Synchronize files to Combell
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend-dist/
          server-dir: /astro-build/